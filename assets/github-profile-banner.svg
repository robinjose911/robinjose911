      <stop stop-color="#07111F"/>
      <stop offset="0.45" stop-color="#0B1B2E"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(190 82) rotate(40) scale(390 220)">
      <stop stop-color="#2DD4BF" stop-opacity="0.42"/>
